rose:{a:"#D4727A",d:"#8B3A4A",bg:"#1A0D10",g:"linear-gradient(135deg,#B85A65,#7A2E3D)",gl:"rgba(212,114,122,0.3)"},

/* ══════════ STORAGE & HELPERS ══════════ */
const SK="bubik-log-v3",CHK="bubik-chk-v3",PK="bubik-protein-v1",WK="bubik-weight-v1",DEFAULT_BW=57;
function jget(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch{return{}}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function loadLog(){return jget(SK)}function saveLog(l){jset(SK,l)}
function loadChecks(){return jget(CHK)}function saveChecks(c){jset(CHK,c)}
// LOCAL date (the old app used UTC, which logged late-night workouts on the wrong day)
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function todayStr(){return dstr(new Date())}
function fmtTime(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function round25(v){return Math.round(v/2.5)*2.5}
function num(v){return Math.round(v*100)/100}

function entriesFor(dayId,exId){
  const log=loadLog(),out=[];
  Object.keys(log).forEach(k=>{const p=k.split("_");
    if(p.length===3&&p[1]===dayId&&p[2]===exId&&log[k]&&log[k].sets){
      const done=log[k].sets.filter(s=>s.d);
      if(done.length)out.push({date:p[0],key:k,sets:done})}});
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
function getLastSession(dayId,exId){const t=todayStr();return entriesFor(dayId,exId).find(e=>e.date!==t)||null}
function getSets(entry,ex,last){
  const ld=last?last.sets:[];
  return Array.from({length:ex.sets},(_,i)=>{
    if(entry&&entry.sets&&entry.sets[i])return entry.sets[i];
    const p=ld[i]||ld[ld.length-1];
    return p?{w:p.w,r:p.r,d:false}:{w:0,r:ex.t==="timed"?ex.target:ex.rep[0],d:false};
  });
}
function exDone(en,ex){return !!(en&&en.sets&&en.sets.filter(s=>s.d).length>=ex.sets)}
function overload(last,sets,ex){
  if(ex.noProg||ex.t==="timed"||!last)return false;
  if(last.sets.length<ex.sets)return false;
  if(!last.sets.every(s=>s.r>=ex.rep[1]))return false;
  const lw=Math.max(...last.sets.map(s=>s.w||0));
  if(sets[0].w>lw)return false;
  return true;
}
function fmtSet(s,ex){if(ex.t==="timed")return s.r+"s";return(s.w>0?num(s.w):"BW")+"\u00D7"+s.r}
function metric(sets,ex){
  if(ex.t==="timed")return sets.reduce((a,s)=>a+s.r,0);
  const vol=sets.reduce((a,s)=>a+(s.w||0)*s.r,0);
  return vol>0?vol:sets.reduce((a,s)=>a+s.r,0);
}

/* ══════════ AUDIO / VIBRATION / WAKE LOCK ══════════ */
let AC=null;
function unlockAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch{}}
try{document.addEventListener("pointerdown",unlockAudio,{passive:true})}catch{}
function playBeep(){try{unlockAudio();if(!AC)return;const beeps=[[880,150],[0,80],[880,150],[0,80],[1100,200]];let t=AC.currentTime;
  beeps.forEach(([f,d])=>{if(f>0){const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=f;o.type="square";g.gain.value=0.3;o.start(t);o.stop(t+d/1000)}t+=d/1000})}catch{}}
function alertNow(p){try{navigator.vibrate(p||[200,100,200])}catch{};playBeep()}
let wl=null;
async function reqWL(){try{if("wakeLock"in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null})}}catch{wl=null}}
function relWL(){try{wl&&wl.release()}catch{}wl=null}

/* ══════════ TIMER (wall-clock based, survives throttling) ══════════
   idle -> run -> (switch sides) -> run -> done. auto=true starts immediately. */
function Timer({seconds,sides,color,auto,onDone,label}){
  const c=CL[color],two=sides===2;
  const[phase,setPhase]=useState(auto?1:0);const[rem,setRem]=useState(seconds);
  const end=useRef(auto?Date.now()+seconds*1000:0);const cb=useRef(onDone);cb.current=onDone;
  useEffect(()=>{
    if(phase!==1&&phase!==3)return;
    const iv=setInterval(()=>{
      const r=Math.ceil((end.current-Date.now())/1000);
      if(r<=0){clearInterval(iv);setRem(0);alertNow();if(phase===1&&two){setPhase(2)}else{setPhase(4);cb.current&&cb.current()}}
      else setRem(r)},250);
    return()=>clearInterval(iv);
  },[phase]);
  const go=p=>{end.current=Date.now()+seconds*1000;setRem(seconds);setPhase(p)};
  if(phase===0)return h("button",{onClick:()=>go(1),style:{background:c.bg,border:"1px solid "+c.d,borderRadius:6,color:c.a,padding:"4px 10px",fontSize:11,fontWeight:800,marginTop:4}},"\u23F1 "+(label||"")+fmtTime(seconds)+(two?" (each)":""));
  if(phase===2)return h("div",{style:{marginTop:4,padding:"8px 12px",background:"#1a1508",border:"1px solid #D4A04C",borderRadius:8,textAlign:"center",animation:"switchPulse 1.5s infinite"}},
    h("div",{style:{fontSize:14,fontWeight:900,color:"#D4A04C"}},"\u21C4 SWITCH SIDES"),
    h("button",{onClick:()=>go(3),style:{marginTop:6,background:"#D4A04C",borderRadius:6,color:"#000",padding:"6px 20px",fontSize:13,fontWeight:800}},"Start side 2"));

/* ══════════ INFO & BACKUP ══════════ */
function DataManager(){
  const[msg,setMsg]=useState("");const fR=useRef(null);
  const flash=(t,ms)=>{setMsg(t);setTimeout(()=>setMsg(""),ms||2500)};
  const doEx=()=>{const d=JSON.stringify({v:1,log:loadLog(),weights:loadWeights(),protein:loadProtein()},null,2);const b=new Blob([d],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="bubik-"+todayStr()+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);flash("Exported!",2000)};
  const doIm=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);
    if(!d||typeof d!=="object"||d.v!==1)throw 0;
    saveLog({...loadLog(),...(d.log||{})});saveWeights({...loadWeights(),...(d.weights||{})});saveProtein({...loadProtein(),...(d.protein||{})});
    flash("Imported! Reload the page.",3500)}catch{flash("Invalid file",2000)}};r.readAsText(f)};
  return h("div",{style:{marginTop:24,padding:"16px",background:"#111",borderRadius:12,border:"1px solid #1a1a1a"}},
    h("div",{style:{fontSize:14,fontWeight:900,marginBottom:10,letterSpacing:1}},"DATA BACKUP"),
    h("div",{style:{fontSize:12,color:"#555",marginBottom:12}},"Workouts, bodyweight and protein in one JSON file. Import merges with existing data. Do this occasionally \u2014 data lives only in this browser."),
    h("div",{style:{display:"flex",gap:10}},
      h("button",{onClick:doEx,style:{flex:1,padding:"10px",background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:10,color:"#888",fontSize:13,fontWeight:700}},"Export"),
      h("button",{onClick:()=>fR.current.click(),style:{flex:1,padding:"10px",background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:10,color:"#888",fontSize:13,fontWeight:700}},"Import")),
    h("input",{ref:fR,type:"file",accept:".json",onChange:doIm,style:{display:"none"}}),msg&&h("div",{style:{marginTop:8,fontSize:12,color:"#2ECC71",fontWeight:700,textAlign:"center"}},msg));
}
